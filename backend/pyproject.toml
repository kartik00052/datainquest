[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daginquest"
version = "0.1.0"
description = "Self-hosted Airflow incident investigator with local LLM and approval gates"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "langgraph>=0.2",
  "psycopg[binary,pool]>=3.2",
  "python-telegram-bot>=21.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/daginquest"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
