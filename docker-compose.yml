services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports: ["11434:11434"]
    # For NVIDIA GPUs add a `deploy.resources.reservations.devices` block.

  airflow:
    image: ${AIRFLOW_IMAGE}
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Check your Airflow version's docs for auth settings if /auth/token fails.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      DAGINQUEST_API_URL: http://api:8000
      DAGINQUEST_WEBHOOK_SECRET: ${WEBHOOK_SECRET}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    ports: ["8080:8080"]

  api:
    build: ./backend
    env_file: .env
    command: uvicorn daginquest.main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8000:8000"]

  bot:
    build: ./backend
    env_file: .env
    command: python -m daginquest.telegram.bot
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  ollama:
